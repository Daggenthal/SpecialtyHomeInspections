<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sign in | Website Editor</title>
<link rel="stylesheet" href="/ui/editor.css">
<script src="/ui/login.js" defer></script>
</head>
<body class="login-page">
<main class="login-card">
  <h1>Website Editor</h1>
  <p class="muted">Specialty Home Inspections LLC</p>
  <form id="login" autocomplete="on">
    <label for="pw">Password</label>
    <input id="pw" name="password" type="password" autocomplete="current-password" required autofocus>
    <button class="btn primary big" type="submit">Sign in</button>
    <p id="msg" class="error" role="alert"></p>
  </form>
  <p class="muted small">This editor only works on your home network. The public website can't reach it.</p>
</main>
</body>
</html>
